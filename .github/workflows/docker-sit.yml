permissions:
  contents: read

name: "HANA Portfolio Backend Services [SIT]"

on:
  push:
    branches:
      - master

jobs:
  portfolio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download env from MinIO
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          docker run --rm \
            -e MINIO_ENDPOINT="$MINIO_ENDPOINT" \
            -e MINIO_ACCESS_KEY="$MINIO_ACCESS_KEY" \
            -e MINIO_SECRET_KEY="$MINIO_SECRET_KEY" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            pgsty/minio:latest \
            sh -c '
              mc alias set minio \
                "$MINIO_ENDPOINT" \
                "$MINIO_ACCESS_KEY" \
                "$MINIO_SECRET_KEY"

              mc cp \
                minio/hana-secrets/portfolio/.env.sit \
                /workspace/.env
            '

          chmod 600 .env
          
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

      - name: Run coverage
        run: npm run test:coverage

      - name: NPM Build Package
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          CONTAINER_NAME: HANA_PORTFOLIO_BE_[SIT]
          WORKFLOW_URL: https://github.com/Nicklas373/hana-portfolio-backend/actions/workflows/docker-sit-env.yml
          IMAGE_NAME: portfolio_backend_build_image
          STATUS: Build HANA Portfolio Backend NPM Package
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          ENV: SIT
        run: |
          chmod +x ./module/bash/docker-build-info.sh
            bash ./module/bash/docker-build-info.sh

      - name: Docker Image Build Notification
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          CONTAINER_NAME: HANA_PORTFOLIO_BE_[SIT]
          WORKFLOW_URL: https://github.com/Nicklas373/hana-portfolio/actions/workflows/docker-sit-env.yml
          IMAGE_NAME: portfolio_be_build_image
          STATUS: Build HANA Portfolio Backend Docker Image
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          ENV: SIT
        run: |
          chmod +x ./module/bash/docker-build-info.sh
            bash ./module/bash/docker-build-info.sh

      - name: Build HANA Portfolio Backend Docker Image
        run: |
          docker build \
            -t nicklas373/hana-portfolio-be-services-sit:1.0.5 \
            -f Dockerfile/Dockerfile.hana-portfolio \
            .
          mkdir -p portfolio_be_image
          docker save -o portfolio_be_image/portfolio_be_image.tar nicklas373/hana-portfolio-be-services-sit:1.0.5

      - name: Load Docker Image Notifications
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          CONTAINER_NAME: HANA_PORTFOLIO_[SIT]
          WORKFLOW_URL: https://github.com/Nicklas373/hana-portfolio-be/actions/workflows/docker-sit-env.yml
          IMAGE_NAME: portfolio_be_build_image
          STATUS: Load HANA Portfolio Docker Image
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          ENV: SIT
        run: |
          chmod +x ./module/bash/docker-build-info.sh
          bash ./module/bash/docker-build-info.sh

      - name: Load Docker Images
        run: docker load -i portfolio_be_image/portfolio_be_image.tar

      - name: Push Docker Image Notifications
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          CONTAINER_NAME: HANA_PORTFOLIO_[SIT]
          WORKFLOW_URL: https://github.com/Nicklas373/hana-portfolio-be/actions/workflows/docker-sit-env.yml
          IMAGE_NAME: portfolio_be_build_image
          STATUS: Push HANA Portfolio Docker Image
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          ENV: SIT
        run: |
          chmod +x ./module/bash/docker-build-info.sh
          bash ./module/bash/docker-build-info.sh

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: nicklas373
          password: ${{ secrets.DOCKER_PAT }}

      - name: Push Docker Image to Docker Hub
        run: docker push nicklas373/hana-portfolio-be-services-sit:1.0.5

      - name: Status Notifications
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          CONTAINER_NAME: HANA_PORTFOLIO_[SIT]
          WORKFLOW_URL: https://github.com/Nicklas373/hana-portfolio-be/actions/workflows/docker-sit-env.yml
          IMAGE_NAME: portfolio_be_build_image
          STATUS: "Build ${{ job.status }}"
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          ENV: SIT
        run: |
          chmod +x ./module/bash/docker-build-info.sh
          bash ./module/bash/docker-build-info.sh
